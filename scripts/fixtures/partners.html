<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Partners</title>
<style>[role=dialog]{position:fixed;inset:20% 20% auto;background:#fff;border:2px solid #000;padding:16px}</style>
<h1>Regístrate en la tienda de apps</h1>
<p>Tarifa única de 19 USD para publicar apps.</p>
<label><input type="checkbox" id="acuerdo"> Acepto el Acuerdo de Partners</label>
<button id="dist">Elegir distribución</button>
<script>
dist.onclick = () => {
  const d = document.createElement("div");
  d.setAttribute("role", "dialog");
  d.setAttribute("aria-labelledby", "Polarismodal-header1");
  d.innerHTML = '<h2 id="Polarismodal-header1">¿Seleccionar distribución pública?</h2><button>Seleccionar</button><button>Cancelar</button>';
  document.body.append(d);
};
</script>
