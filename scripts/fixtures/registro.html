<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Alta de cliente · Panadería La Espiga</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f6f5fb;color:#1c1b3a}
header{background:#fff;border-bottom:1px solid #e6e4f2;padding:16px 32px;font-weight:700;font-size:18px}
main{max-width:560px;margin:32px auto;background:#fff;border:1px solid #e6e4f2;border-radius:14px;padding:28px 32px}
h1{font-size:24px;margin:0 0 4px} p{color:#6b6a85;margin:0 0 20px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #d9d7ea;border-radius:8px;background:#fff}
.row{display:flex;gap:12px}.row>div{flex:1}
.check{display:flex;gap:8px;align-items:center;margin-top:16px;font-weight:400}.check input{width:auto}
button{margin-top:22px;background:#1c1b3a;color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600}
</style></head><body>
<header>🥖 Panadería La Espiga</header>
<main>
<h1>Alta de cliente mayorista</h1><p>Registra a un nuevo cliente para pedidos semanales.</p>
<label for="nombre">Nombre del negocio</label><input id="nombre">
<div class="row"><div><label for="contacto">Contacto</label><input id="contacto"></div><div><label for="tel">Teléfono</label><input id="tel"></div></div>
<label for="ciudad">Ciudad</label><select id="ciudad"><option>Elige…</option><option>Ciudad de México</option><option>Oaxaca</option><option>Guadalajara</option></select>
<label for="pedido">Pedido semanal</label><textarea id="pedido" rows="3"></textarea>
<label class="check"><input type="checkbox" id="factura"> Requiere factura</label>
<button type="button">Guardar cliente</button>
</main></body></html>
